name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleFfmaxDebug assembleFfthDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BurikTool-FFMAX
          path: app/build/outputs/apk/ffmax/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BurikTool-FF
          path: app/build/outputs/apk/ffth/debug/*.apk
